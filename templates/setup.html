{% extends "layout.html" %}
{% block content %}
<h2>初始化（创建初始 Admin）</h2>

<form method="post" action="{{ url_for('setup') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <div class="row">
    <div>
      <label>用户名</label>
      <input name="username" required>
    </div>
    <div>
      <label>密码</label>
      <input name="password" type="password" required>
    </div>
  </div>

  <p><button class="btn" type="submit">创建 Admin</button></p>
</form>
{% endblock %}
