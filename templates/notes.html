{% extends "layout.html" %}
{% block content %}
<h2>随记</h2>

<div style="margin-bottom: 20px;">
  <form method="post" action="{{ url_for('notes_create') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <textarea name="content" placeholder="输入随记内容..." style="width: 100%; min-height: 150px; padding: 8px; box-sizing: border-box; font-family: Arial, sans-serif; font-size: 14px;" required></textarea>
    <button type="submit" class="btn" style="margin-top: 10px;">保存</button>
  </form>
</div>

<h3>历史记录</h3>
{% if notes %}
<table>
  <thead>
    <tr>
      <th style="width: 180px;">记录时间</th>
      <th style="width: 120px;">用户名</th>
      <th>内容</th>
      <th style="width: 150px;">操作</th>
    </tr>
  </thead>
  <tbody>
  {% for note in notes %}
    <tr>
      <td>{{ note.get("created_at") | dt8 }}</td>
      <td>{{ note.get("username") }}</td>
      <td style="white-space: pre-wrap; word-wrap: break-word;">{{ note.get("content") }}</td>
      <td>
        <textarea id="note-content-{{ note.get('_id') }}" style="display: none;">{{ note.get("content") }}</textarea>
        <button onclick="editNote('{{ note.get('_id') }}')" class="btn" style="margin-right: 5px;">修改</button>
        <form method="post" action="{{ url_for('notes_delete', note_id=note.get('_id')) }}" style="display:inline" onsubmit="return confirm('确认删除该随记？')">
          <input type="hidden" name="_csrf" value="{{ csrf_token }}">
          <button type="submit" class="btn">删除</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<p class="muted">暂无随记记录</p>
{% endif %}

<!-- 编辑模态框 -->
<div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
  <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px; width: 80%; max-width: 600px;">
    <h3>修改随记</h3>
    <form method="post" id="editForm">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <textarea name="content" id="editContent" style="width: 100%; min-height: 150px; padding: 8px; box-sizing: border-box; font-family: Arial, sans-serif; font-size: 14px;" required></textarea>
      <div style="margin-top: 10px;">
        <button type="submit" class="btn">保存</button>
        <button type="button" class="btn" onclick="closeEditModal()" style="margin-left: 10px;">取消</button>
      </div>
    </form>
  </div>
</div>

<script>
function editNote(noteId) {
  var contentEl = document.getElementById('note-content-' + noteId);
  var content = contentEl ? contentEl.value : '';
  document.getElementById('editForm').action = '/notes/' + noteId + '/update';
  document.getElementById('editContent').value = content;
  document.getElementById('editModal').style.display = 'block';
}

function closeEditModal() {
  document.getElementById('editModal').style.display = 'none';
}

// 点击模态框外部关闭
document.getElementById('editModal').addEventListener('click', function(e) {
  if (e.target === this) {
    closeEditModal();
  }
});
</script>
{% endblock %}
