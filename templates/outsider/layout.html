<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Luxury Inventory</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <style>
    body { font-family: Arial, sans-serif; margin: 18px; }
    nav a { margin-right: 12px; }
    .msg { padding: 8px; margin: 10px 0; border: 1px solid #ddd; }
    .ok { border-color: #9ad29a; }
    .error { border-color: #e3a1a1; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; font-size: 14px; vertical-align: top; }
    th { background: #f5f5f5; }
    .muted { color: #666; font-size: 12px; }
    input, textarea { padding: 6px; width: 100%; box-sizing: border-box; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { padding: 8px 10px; cursor: pointer; }
    .tag { display:inline-block; padding:2px 6px; border:1px solid #ddd; border-radius:6px; font-size:12px; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('outsider_index') }}">Dashboard</a>
    <a href="{{ url_for('outsider_list_items') }}">Items</a>
    <span class="muted">User: {{ session.get("username") }} ({{ session.get("role") }})</span>
    <a href="{{ url_for('logout') }}">Logout</a>
  </nav>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="msg {{cat}}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
